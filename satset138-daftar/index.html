        }

        .redirect-box {
            width: 100%;

        }

        .logo {
            max-width: 180px;
            height: auto;

        }

        .icon {

        }

        .loader {
            width: 38px;
            height: 38px;

            border: 4px solid #e3eaf5;

            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 24px;
            border-radius: 30px;
            background: #1a3b5d;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

            padding-top: 18px;
            border-top: 1px solid #eef2f6;
            font-size: 12px;
            color: #7a94ae;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .redirect-box {

            }
